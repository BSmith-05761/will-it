version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: willit-backend:dev
    env_file:
      - .env
    environment:
      - WILLIT_VERSION=${WILLIT_VERSION}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./docs:/app/docs
      - ./prompt_drivers.py:/app/prompt_drivers.py
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:8000
    image: willit-frontend:dev
    depends_on:
      - backend
    ports:
      - "5173:5173"
    # no volumes; serving static build
    restart: unless-stopped

